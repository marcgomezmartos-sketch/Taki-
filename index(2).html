<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BARBAS PARTY — Barbas City</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211c43;color:white;font:600 15px system-ui;touch-action:none}canvas{display:block}#hud{position:fixed;top:12px;left:14px;z-index:3;text-shadow:0 2px 6px #28213b}#hud b{font-size:24px;color:#ffe28b}#status{margin-top:5px;font-size:13px;max-width:72vw}#menu{position:fixed;inset:0;background:linear-gradient(#17132c99,#17132cdd);z-index:8;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:25px;gap:13px}h1{font-size:clamp(35px,9vw,68px);margin:0;color:#ffe27c;text-shadow:0 4px #ac4e8c}p{max-width:470px;margin:4px}button{border:0;border-radius:16px;background:#ffd34f;color:#28213b;padding:14px 21px;font-weight:900;font-size:16px;cursor:pointer}#notice{font-size:12px;color:#ffdfd7;max-width:470px}#controls{position:fixed;bottom:19px;left:16px;right:16px;z-index:5;display:none;justify-content:space-between;pointer-events:none}.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.ctl{pointer-events:auto;touch-action:none;background:#ffffffbb;padding:0;min-width:54px;min-height:54px;font-size:22px}.actions{display:flex;gap:7px;align-items:end}.actions .ctl{font-size:12px;padding:9px}.panel{position:fixed;inset:0;z-index:9;background:#181a35ee;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:25px}.panel h2{font-size:29px;margin:0}.panel p{max-width:460px}#topbtn{position:fixed;top:15px;right:15px;z-index:6;display:none;padding:9px 14px;font-size:13px}#skinChoice{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}.choice{background:#9cdef0}#fatal{position:fixed;bottom:4px;left:5px;z-index:20;color:#ffb3b3;font-size:12px}</style></head><body><div id="hud"><b>🌅 BARBAS CITY</b><div id="status">Explora la ciudad y visita las tiendas</div></div><div id="menu"><h1>BARBAS PARTY</h1><p>🌇 Barbas City V10 · TK SHOP explorable y atardecer</p><button id="start">ENTRAR EN LA CIUDAD</button><span id="notice">V10: salta mientras corres, visita TK SHOP y disfruta del atardecer.</span></div><button id="topbtn">☰ MENÚ</button><div id="controls"><div class="pad"><button class="ctl up" data-key="KeyW">▲</button><button class="ctl left" data-key="KeyA">◀</button><button class="ctl down" data-key="KeyS">▼</button><button class="ctl right" data-key="KeyD">▶</button></div><div class="actions"><button class="ctl" id="interact">USAR</button><button class="ctl" data-key="ShiftLeft">CORRER</button><button class="ctl" id="jump">SALTAR</button></div></div><div id="panel" class="panel"><h2 id="panelTitle">Tienda</h2><p id="panelText"></p><div id="skinChoice"></div><button id="closePanel">VOLVER A LA CIUDAD</button></div><div id="fatal"></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script><script>
window.__barbasLoaded = false;
const startButton = document.getElementById('start');
startButton.addEventListener('click', () => {
  if (!window.__barbasLoaded) {
    document.getElementById('notice').textContent = '⚠️ El juego no se ha cargado. Comprueba la conexión y el mensaje de error de abajo.';
  }
});
window.addEventListener('error', e => {
  document.getElementById('fatal').textContent = 'Error: ' + (e.message || 'No se pudo cargar un archivo');
});
</script>
<script type="module">
try {
  await import('./game.js');
  window.__barbasLoaded = true;
} catch (error) {
  document.getElementById('fatal').textContent = 'No se pudo iniciar el juego: ' + (error?.message || String(error));
  document.getElementById('notice').textContent = '⚠️ Fallo al cargar el juego. Haz una captura del mensaje rojo de abajo.';
}
</script></body></html>
